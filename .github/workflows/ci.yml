name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
      - name: type-check for the phone
        run: cargo check --locked --release --target aarch64-linux-android
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ui/sw.test.mjs ui/services/ws-ticket.test.mjs ui/services/websocket.service.test.mjs
      - name: no external origins in the UI
        run: |
          if grep -rnE "https?://(unpkg|cdn|fonts\.|esm\.sh|cdnjs|pplx|cognitum)" ui --include=*.html --include=*.js --include=*.css --include=*.mjs --exclude-dir=vendor --exclude=sw.test.mjs; then
            echo "external origin referenced by the UI"; exit 1; fi
